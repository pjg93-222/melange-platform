# Exported to .github/workflows/deps.yml. Offline dependency bundles, rebuilt only when a lock
# changes. One draft release per lock state: deps-<hash12>, hash of every lock that feeds it.
# What is built here: the Linux wheelhouse (compute runs in Linux containers, D-173, so there is no Windows wheelhouse).
# The npm cache lives in Geo's own workflow (no cross-repo token). The R bundle (job r-bundle) is the lock's exact versions.
name: deps

on:
  push:
    branches: [main]
    paths: ["ops/locks/**"]
  workflow_dispatch:

permissions: {}

env:
  # Base Posit Package Manager snapshot of the R bundle: exact per-package pins (decided 2026-10-12). It serves 199 of the 214
  # packages of ops/locks/r-packages.txt at the lock version; ops/locks/r-package-repos.txt names the dated repo for each of the
  # other 15. The same date and pins as docker/compute-mentat.Dockerfile (a test keeps the date equal). R_VERSION is the minor
  # of ops/locks/r-packages.txt (made with R 4.6.0); binaries are per minor.
  PPM_SNAPSHOT_DATE: "2026-06-19"
  R_VERSION: "4.6"

jobs:
  key:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    outputs:
      hash12: ${{ steps.h.outputs.hash12 }}
      exists: ${{ steps.h.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - id: h
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          hash12=$(cat ops/locks/*.txt | sha256sum | cut -c1-12)
          echo "hash12=$hash12" >> "$GITHUB_OUTPUT"
          if gh release view "deps-$hash12" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  wheelhouse:
    needs: key
    if: needs.key.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Hash-checked downloads for Linux
        run: |
          set -euo pipefail
          for lock in ops/locks/*.linux.txt; do   # pip locks only: r-packages.txt is not a requirements file
            name=$(basename "$lock" .txt)
            python -m pip download --require-hashes --only-binary=:all: --no-deps \
              --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_28_x86_64 \
              --platform manylinux_2_34_x86_64 \
              --python-version 3.12 --implementation cp --abi cp312 \
              -r "$lock" -d "wheelhouse/$name/manylinux2014_x86_64"
          done
          tar --sort=name --owner=0 --group=0 --numeric-owner -cf - wheelhouse | gzip -n -9 > wheelhouse.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: wheelhouse, path: wheelhouse.tar.gz}

  # The R bundle: Windows binaries of exactly the lock's versions (ops/locks/r-packages.txt). It was switched off until the PPM
  # date was ratified; exact per-package pins (decided 2026-10-12) replace the single date, so it is on again.
  r-bundle:
    needs: key
    if: needs.key.outputs.exists != 'true'
    runs-on: windows-2022
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with: {r-version: "${{ env.R_VERSION }}"}
      - name: Download win.binary packages, each from the dated repo that carries exactly its lock version
        shell: Rscript {0}
        run: |
          lines <- trimws(readLines("ops/locks/r-packages.txt"))
          lines <- lines[nzchar(lines) & !startsWith(lines, "#")]
          stopifnot(length(lines) > 0, all(grepl("^[A-Za-z][A-Za-z0-9.]*==[0-9][0-9.-]*$", lines)))
          pkgs <- sub("==.*$", "", lines)
          want <- sub("^.*==", "", lines)
          # the base snapshot for every package, then the dated repo ops/locks/r-package-repos.txt names for the 15 it does not serve
          date <- rep(Sys.getenv("PPM_SNAPSHOT_DATE"), length(pkgs))
          pins <- trimws(readLines("ops/locks/r-package-repos.txt"))
          pins <- strsplit(pins[nzchar(pins) & !startsWith(pins, "#")], "[[:space:]]+")
          for (pin in pins) {
            i <- match(sub("==.*$", "", pin[1]), pkgs)
            stopifnot(!is.na(i), want[i] == sub("^.*==", "", pin[1]))
            date[i] <- pin[2]
          }
          repo <- function(d) sprintf("https://packagemanager.posit.co/cran/%s", d)
          # the lock names exact versions: a repo that serves others is a different bundle, not a quiet substitution
          avail <- lapply(structure(unique(date), names = unique(date)), function(d) available.packages(repos = repo(d), type = "win.binary"))
          have <- mapply(function(p, d) if (p %in% rownames(avail[[d]])) avail[[d]][p, "Version"] else NA_character_, pkgs, date)
          off <- paste0(pkgs, "==", want, " (", date, ": ", have, ")")[is.na(have) | have != want]
          if (length(off)) stop("repos differ from the lock: ", paste(off, collapse = ", "))
          dir.create("r-bundle")
          manifest <- sprintf("base snapshot %s, %d pinned", Sys.getenv("PPM_SNAPSHOT_DATE"), length(pins))
          for (d in names(avail)) {
            got <- download.packages(pkgs[date == d], destdir = "r-bundle", available = avail[[d]], repos = repo(d), type = "win.binary")
            manifest <- c(manifest, sprintf("%s %s", basename(got[, 2]), d))
          }
          writeLines(manifest, "r-bundle/MANIFEST.txt")
      - run: tar -czf r-bundle.tgz r-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: r-bundle, path: r-bundle.tgz}

  publish:
    needs: [key, wheelhouse, r-bundle]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {path: out, merge-multiple: true}
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: deps-${{ needs.key.outputs.hash12 }}
        run: |
          set -euo pipefail
          (cd out && sha256sum * > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" \
            --notes "Offline dependency bundle (Linux wheelhouse, R win.binary packages). Verify against SHA256SUMS." out/*
