# Exported to .github/workflows/desktop-source-checks.yml in melange-platform.
# Source checks only. Native signing, installer acceptance and publication are separate gates.
name: desktop-source-checks

on:
  push:
    branches: [main]
    paths:
      - 'ops/desktop/**'
      - 'fec/**'
      - 'mentat/**'
      - 'ops/sync_sources.py'
      - 'ops/tests/test_sync_sources.py'
      - 'ops/auto/*SourceSync.ps1'
      - 'ops/auto/source_sync_task.py'
      - '.github/workflows/desktop-source-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; existing platform pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; existing platform pin
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install client dependencies from lockfile
        working-directory: ops/desktop/client
        run: npm ci
      - name: Test desktop receiver
        working-directory: ops/desktop/client
        run: npm test
      - name: Install publisher test dependencies
        run: python -m pip install -r ops/desktop/server/requirements.txt pytest==8.4.2
      - name: Test release preparation and guarded source synchronization
        run: python -m pytest ops/desktop/packaging/test_github_release.py ops/tests/test_sync_sources.py -q
