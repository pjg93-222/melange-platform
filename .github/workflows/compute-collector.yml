# Exported to .github/workflows/compute-collector.yml in pjg93-222/melange-platform.
# CI is the only builder of the compute-collector image (D-175); the laptop pulls it by digest and never builds. Runs on the same
# v* tags as release.yml (so release.py waits for it and reads its digest, ops/RELEASE.md "Automatic propagation") or by hand. The
# image is built only when its inputs changed (ops/image_inputs.json, the tag inputs-<hash>); otherwise the digest already in GHCR
# is reused and the same smoke tests, SBOM and gate run on it. The digests job reports the digest to release.py, after the smoke
# tests and the gate below pass: nothing here deploys anything.
#
# Every action is pinned to a full commit SHA (the tag it was resolved from is the trailing comment); same pins as release.yml.
name: compute-collector

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: compute-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      # Same install line as release.yml's test job (requirements.txt carries requests, which the replay test exercises).
      - run: python -m pip install -r requirements.txt pyyaml==6.0.3 cryptography==49.0.0
      - run: python -m compileall -q ops fec/collect fec/classifier_runtime.py fec/legislation
      - name: Replay harness, claude-CLI container contract, image/compose/workflow policy
        run: python -m pytest -q ops/tests/test_http_replay.py ops/tests/test_http_replay_proxy.py ops/tests/test_http_replay_collectors.py ops/tests/test_claude_cli_container.py ops/tests/test_compute_collector_policy.py ops/tests/test_compose_policy.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Image tag
        id: tag
        env: {REF_TYPE: "${{ github.ref_type }}", REF_NAME: "${{ github.ref_name }}", RUN_NUMBER: "${{ github.run_number }}"}
        run: |
          # a ref name may hold commas (buildx splits `outputs:` on them) or other odd characters: nothing runs on one
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "::error::tag does not match v<YYYY>.<MM>.<DD>.<n>"; exit 1; }
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dispatch-$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Pins from ops/images.lock and the Dockerfile (fail closed on a placeholder or a missing hash lock)
        id: pins
        run: |
          set -euo pipefail
          lock=ops/locks/compute-collector.linux.lock
          [ -f "$lock" ] || { echo "::error::$lock is missing (recipe in ops/docker/compute-collector.Dockerfile header)"; exit 1; }
          grep -q -- '--hash=sha256:' "$lock" || { echo "::error::$lock has no hashes"; exit 1; }
          dockerfile=ops/docker/compute-collector.Dockerfile
          arg() { sed -n "s/^ARG $1=//p" "$dockerfile"; }
          node_dig=$(jq -r '.node.digest' ops/images.lock)
          debian_dig=$(arg DEBIAN_BASE | sed 's/.*@//')
          for dig in "$node_dig" "$debian_dig"; do
            if ! [[ "$dig" =~ ^sha256:[0-9a-f]{64}$ ]] || [[ "$dig" =~ ^sha256:0{64}$ ]]; then
              echo "::error::a base image digest is a placeholder or malformed: $dig"; exit 1
            fi
          done
          {
            echo "node=$(jq -r '.node.ref + "@" + .node.digest' ops/images.lock)"
            echo "python_version=$(arg CPYTHON_VERSION)"
            echo "claude_version=$(arg CLAUDE_CODE_VERSION)"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "created=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Input hash of this image
        id: inputs
        run: echo "hash=$(python3 ops/release_lib/inputs.py hash compute-collector)" >> "$GITHUB_OUTPUT"
      - name: Reuse the image built from the same inputs, if there is one
        id: reuse
        env: {HASH: "${{ steps.inputs.outputs.hash }}"}
        run: bash ops/ci/build_or_reuse.sh check ghcr.io/pjg93-222/compute-collector "$HASH"
      - name: Build and push (tag for humans, digest for the manifest)
        id: push
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ops/docker/compute-collector.Dockerfile
          outputs: type=image,name=ghcr.io/pjg93-222/compute-collector:${{ steps.tag.outputs.tag }},push=true,rewrite-timestamp=true
          # No layer cache: a cache entry can be written by any other workflow run in the repo and would ride, unseen, into an image
          # that runs with the API keys and the CLI login.
          no-cache: true
          provenance: false
          sbom: false
          build-args: |
            NODE_BASE=${{ steps.pins.outputs.node }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.pins.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.pins.outputs.epoch }}
      - name: Digest of this image (reused or just built)
        id: image
        env:
          DIGEST: "${{ steps.reuse.outputs.reused == 'true' && steps.reuse.outputs.digest || steps.push.outputs.digest }}"
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from build"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$DIGEST" > digest-compute-collector.txt
      # Imports, Chromium + Playwright headless, claude --version at the pinned version, login staging, and no credentials anywhere.
      - name: Smoke tests inside the pushed image (network none)
        env:
          IMAGE: ghcr.io/pjg93-222/compute-collector@${{ steps.image.outputs.digest }}
          PYTHON_VERSION: ${{ steps.pins.outputs.python_version }}
          CLAUDE_VERSION: ${{ steps.pins.outputs.claude_version }}
        run: sh ops/compute/smoke_collector.sh "$IMAGE" "$PYTHON_VERSION" "$CLAUDE_VERSION"
      # Only after the smoke tests: an image that failed them never becomes the one the next release reuses.
      - name: Tag the new image with its inputs, so the next release can reuse it
        if: steps.reuse.outputs.reused != 'true'
        env: {HASH: "${{ steps.inputs.outputs.hash }}", DIGEST: "${{ steps.image.outputs.digest }}"}
        run: bash ops/ci/build_or_reuse.sh tag ghcr.io/pjg93-222/compute-collector "$HASH" "$DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-compute-collector
          path: digest-compute-collector.txt

  sbom:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: digest-compute-collector}
      - id: ref
        run: echo "image=ghcr.io/pjg93-222/compute-collector@$(cat digest-compute-collector.txt)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom-compute-collector.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-compute-collector
          path: sbom-compute-collector.spdx.json

  scan:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: digest-compute-collector}
      - name: Install trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          set -euo pipefail
          curl -fsSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          sudo tar -xzf trivy.tgz -C /usr/local/bin trivy
      # The gate's images stage: trivy on the pushed digest, and the compose policy on the collector compose rendered with placeholders
      # (host paths are the wrapper's; the secret files are any existing file for the render).
      - name: Gate the image and the rendered collector compose
        run: |
          set -euo pipefail
          export IMAGE_COMPUTE_COLLECTOR="ghcr.io/pjg93-222/compute-collector@$(cat digest-compute-collector.txt)"
          for v in MELANGE_HOST_ROOT GLASSBOX_HOST_EVENTS LDA_RAW_HOST_DIR CASSETTE_HOST_DIR REPLAY_OUT_HOST_DIR; do export "$v=/tmp"; done
          for v in GOVINFO_KEY_FILE_HOST FEC_DATA_GOV_FILE_HOST CLAUDE_CREDENTIALS_FILE_HOST; do export "$v=/dev/null"; done
          docker compose -f ops/compute/collectors.compose.yaml --profile collect --profile llm --profile replay config --format json > compose.config.json
          python ops/security_gate.py images --ci --compose-json compose.config.json \
            --image "$IMAGE_COMPUTE_COLLECTOR" --report security-images-compute-collector.json

  # What release.py reads (ops/RELEASE.md, "Compute workflows adopt it"): a workflow artifact named *-digests holding digests.json,
  # written only after the smoke tests (build), the SBOM and the images gate have passed on this digest.
  digests:
    needs: [build, sbom, scan]
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - name: Write digests.json (same shape as the release kit's)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
          IMAGE: ghcr.io/pjg93-222/compute-collector@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from build"; exit 1; }
          jq -n --arg tag "$TAG" --arg sha "$SHA" --arg image "$IMAGE" '{tag: $tag, commit: $sha, images: {"compute-collector": $image}}' > digests.json
          cat digests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compute-collector-digests
          path: digests.json
