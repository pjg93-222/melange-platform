[package]
name = "mentat-scan"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
quick-xml = "=0.31.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

