<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; media-src 'self'"><title>Terrier</title><style>body{margin:0;background:#fcf7f4;color:#342649;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{text-align:center}video{width:180px;height:180px;object-fit:contain;mix-blend-mode:multiply}.still{display:none;width:180px;height:180px;object-fit:contain;mix-blend-mode:multiply}h1{font-size:32px;font-weight:650;margin:0 0 12px}p{color:#75687d;margin:0}.detail{min-height:1.4em;max-width:440px;margin:10px auto 0;font-size:14px}.track{width:160px;height:3px;background:#ece2e7;margin:28px auto;overflow:hidden;border-radius:2px}.bar{height:100%;width:40%;background:#aa7c39;animation:loading 1.3s ease-in-out infinite alternate}@keyframes loading{to{transform:translateX(150%)}}@media(prefers-reduced-motion:reduce){video{display:none}.still{display:inline-block}.bar{animation:none;width:100%}}</style><main role="status" aria-live="polite"><video autoplay muted loop playsinline poster="loading-assets/terrier-icon-hq.png" aria-hidden="true"><source src="loading-assets/terrier-loading-hq.mp4" type="video/mp4"></video><img class="still" src="loading-assets/terrier-icon-hq.png" alt=""><h1>Terrier</h1><p>Opening your workspace</p><div class="track" aria-hidden="true"><div class="bar"></div></div><p class="detail" id="detail"></p></main><script src="loading.js"></script></html>
