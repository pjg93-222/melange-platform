#cloud-config
# Melange VPS (Ubuntu 24.04 LTS, US region, 16 GB RAM, 4-8 vCPU, ~250 GB data volume).
# Paste as user-data when creating the server; read ops/VPS.md first. Nothing secret is in here (user-data is readable
# from the provider's metadata service); every value Paul sets is marked PASTE-..., and `sudo melange-bootstrap`
# re-runs the setup after they are filled in.
#
# Nothing is reachable from the internet afterwards: ufw denies all inbound, sshd listens on loopback and the egress
# bridge gateway only, and the one door in is the cloudflared container (Cloudflare Tunnel + Access).
#
# The payload block is generated: python ops/vps/build_cloud_init.py packs the updater, host scripts, systemd units,
# compose files and host-files.toml (the static sshd/Docker/audit/apt config) from the real files. Do not edit it.

hostname: melange-vps
timezone: UTC
ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
package_reboot_if_required: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - restic
  - age
  - sqlite3
  - auditd
  - unattended-upgrades
  - cryptsetup
  - jq
  - ufw

users:
  - name: admin
    gecos: Melange administrator
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) ALL"
    lock_passwd: false
    # PASTE-ADMIN-PASSWORD-HASH: output of `mkpasswd -m sha-512` on any Linux box. This is the
    # break-glass console login and the sudo password; keep the plain password on paper.
    passwd: "PASTE-ADMIN-PASSWORD-HASH"
    ssh_authorized_keys:
      # PASTE-ADMIN-PUBKEY: Paul's ssh public key, used through the Cloudflare ssh route.
      - "ssh-ed25519 PASTE-ADMIN-PUBKEY paul@laptop"
  - name: melange-push
    gecos: Laptop push (sftp only, chrooted)
    shell: /usr/sbin/nologin
    homedir: /
    no_create_home: true
    lock_passwd: true

write_files:
  - path: /etc/melange/bootstrap.env
    permissions: "0640"
    content: |
      # /etc/melange/bootstrap.env: values Paul sets before pasting (or edits here, then runs
      # `sudo melange-bootstrap`). Not secret.
      #
      # PASTE-DATA-DEVICE: the provider's data volume, never the boot disk. Use the stable path,
      # e.g. /dev/disk/by-id/scsi-0HC_Volume_12345678, and check `lsblk -f` shows no filesystem.
      # The bootstrap refuses to format anything that already has a filesystem or a LUKS header.
      DATA_DEVICE=PASTE-DATA-DEVICE
      #
      # Pinned Docker apt versions (ops/VPS.md, "Pin Docker"). Until all three are set Docker is
      # not installed, and without the data volume it is not installed either.
      DOCKER_VERSION=PASTE-DOCKER-VERSION
      CONTAINERD_VERSION=PASTE-CONTAINERD-VERSION
      COMPOSE_VERSION=PASTE-COMPOSE-VERSION

  - path: /etc/melange/allowed_signers
    permissions: "0644"
    content: |
      # PASTE-ALLOWED-SIGNERS-LINE: replace this file's single line with the release public key:
      #   release@melange namespaces="melange-release" ssh-ed25519 AAAA...
      # (the .pub of the laptop's release signing key, with that prefix). The updater refuses every
      # manifest that does not verify against it.
      release@melange namespaces="melange-release" ssh-ed25519 PASTE-RELEASE-PUBLIC-KEY

  - path: /etc/melange/age_recipients
    permissions: "0644"
    content: |
      # PASTE-AGE-RECIPIENT: one age public key (age1...) per line; the laptop holds the private
      # key. Terrier backups are encrypted to these and nobody on this server can read them.
      # age1PASTE-AGE-RECIPIENT

  - path: /etc/ssh/authorized_keys/melange-push
    permissions: "0644"
    content: |
      # PASTE-PUSH-PUBKEY: the laptop's push key (an ed25519 public key), reached through
      # `cloudflared access ssh` with the svc-push service token. sftp only, chrooted.
      # ssh-ed25519 PASTE-PUSH-PUBKEY push@laptop

  # BEGIN PAYLOAD (generated by ops/vps/build_cloud_init.py; do not edit)
  - path: /opt/melange/payload.tar.xz
    permissions: "0600"
    encoding: b64
    content: |
      
      
      
      
      
      
      
      
      
      
      
      
      
      
  # END PAYLOAD

runcmd:
  # Unpack the payload once (never again: later releases update these files), then set up.
  - [sh, -c, "tar -C / --no-same-owner -xJf /opt/melange/payload.tar.xz && /usr/local/sbin/melange-bootstrap"]
